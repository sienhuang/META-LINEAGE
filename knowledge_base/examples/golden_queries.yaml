# ============================================================================
# Golden SQL 样例 —— Text-to-SQL 准确率最大的杠杆。
# 决策(DESIGN §7): 默认走【宽表路径】, 明细仅兜底。
# 样例必须教会 LLM 两件它不会的事: ① indicator_map['x'] 非标取数 ② 口径由ETL保证不必重算。
# path 字段标明走哪条路, 被 RAG 召回作 few-shot。
# ============================================================================
- id: month_avg_activation_mlbb_lastmonth
  question: mlbb 上个月的月均活跃度是多少？
  path: wide_table                 # wide_table(默认) | detail(兜底)
  dialect: doris
  dataset_id: "300016"             # 复用它的 dataset SQL(查 doris宽表, 过滤/scope 已写对)
  # 走宽表的正确姿势: 不重写宽表查询, 而是【包住 dataset SQL + 套 measure 公式】
  sql: |
    SELECT sum(indicator_map['avg_active_cnt'])
             / cast(sum(indicator_map['mau']) as decimal(38,0)) AS 月均活跃度
    FROM   ( /* dataset 300016 的原始 SQL, 查 dws_mlbb_indicator_wide_1d, 含月度固定过滤 */ ) t
  uses:
    metric: month_avg_activation
    base_indicators: [avg_active_cnt, mau]   # 均为 map_key, 故用 indicator_map['x'] 取
  notes: >
    走宽表路径 = 复用 dataset SQL(口径/过滤/scope 它已写对) + 把 measure 公式套成 SELECT 聚合。
    切忌让 LLM 重写宽表的 WHERE —— 那是在重造 dataset SQL 已写好的过滤, 反而引入口径偏差。
    map_key 形态的底层指标用 indicator_map['x'], 直接列形态(如 pcu)直接写列名。

# 兜底样例骨架(明细路径): 仅当宽表无对应维度/粒度时才走, 需按 D 层 algo 重建口径
- id: _detail_fallback_template
  question: "[模板] 当宽表没有所需维度时, 降级查明细的写法"
  path: detail
  dialect: spark_sql
  sql: |
    -- [模板] 必须照 base_indicators.algo 的 D 层口径重算, 并带上 known_issues 的过滤
    -- 例: avg_active_cnt 的 algo = sum(active_cnt)/count(distinct logymd)
    -- SELECT ... FROM dwd.dwd_mlbb_user_active_di WHERE test_flag=0 ...
  notes: 明细路径风险在口径重算; 务必注入 algo + known_issues, 不可让 LLM 自行猜口径。
